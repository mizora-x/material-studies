<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Thaw Switch — Material Studies No. 063</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <p class="kicker">Material Studies / No. 063 · WebGL + Web Audio</p>
    <h1>Thaw Switch.</h1>
    <p class="cap">Drag a drop of glass across a snowed-in hollow and let spring run in behind it.</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" role="slider" tabindex="0" aria-label="Thaw switch, winter to spring" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="−12°C, Deep winter"></canvas>
  </div>
  <dl class="read">
    <div><dt>Temp</dt><dd id="rc">−12°C</dd></div>
    <div><dt>Season</dt><dd id="rl">Deep winter</dd></div>
    <div><dt>Music</dt><dd id="rm">Wind</dd></div>
  </dl>
  <footer>
    <p class="hint">Drag the knob or the track · tap to flip · ← → Home End Space</p>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
  </footer>
</main>
<script src="main.js"></script>
</body>
</html>
