<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Daybreak Switch — Material Studies No. 062</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <p class="kicker">Material Studies / No. 062 · WebGL + Web Audio</p>
    <h1>Daybreak Switch.</h1>
    <p class="cap">Drag a jelly-glass knob across a small pixel room and pull the morning in behind it.</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" role="slider" tabindex="0" aria-label="Daybreak switch, night to morning" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="02:00, Night"></canvas>
  </div>
  <dl class="read">
    <div><dt>Clock</dt><dd id="rc">02:00</dd></div>
    <div><dt>Light</dt><dd id="rl">Night</dd></div>
    <div><dt>Music</dt><dd id="rm">Crickets</dd></div>
  </dl>
  <footer>
    <p class="hint">Drag the knob or the track · tap to flip · ← → Home End Space</p>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
  </footer>
</main>
<script src="main.js"></script>
</body>
</html>
