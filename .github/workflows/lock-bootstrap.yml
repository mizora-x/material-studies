# One-off: generate actions.lock with the official tool and print it as a patch.
# Removes itself from the checkout first so it is not locked. Deleted again in the next commit.
name: Lockfile bootstrap

on:
  push:
    branches: [astro-migration]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: git rm -q .github/workflows/lock-bootstrap.yml
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock
      - run: gh actions-lock --verify
      - name: Print patch
        run: |
          git add -A
          git status --short
          echo "-----BEGIN PATCH-----"
          git diff --cached --binary | base64 -w0
          echo
          echo "-----END PATCH-----"
